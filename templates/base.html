<!doctype html>
{% load i18n %}
<html lang="{{ LANGUAGE_CODE|default:'ru' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{% block title %}Автосервис{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <script>
    (function () {
      var key = 'autosite-theme';
      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem(key);
      } catch (error) {
        storedTheme = null;
      }

      var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
      var theme = storedTheme || systemTheme;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: {
            soft: '0 16px 40px rgba(15, 23, 42, 0.12)',
            plate: '0 22px 70px rgba(15, 23, 42, 0.16)',
          },
          colors: {
            brand: {
              ink: '#101317',
              sand: '#f5f0e8',
              lime: '#d7ff63',
              orange: '#f46a34',
              sky: '#8dc6ff',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --page-bg: #f5f0e8;
      --page-bg-deep: #efe7dd;
      --panel: rgba(255, 252, 247, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --ink: #101317;
      --muted: #5c6472;
      --accent: #d7ff63;
      --accent-orange: #f46a34;
      --accent-sky: #8dc6ff;
      --border: rgba(16, 19, 23, 0.08);
    }

    :root[data-theme="dark"] {
      --page-bg: #090d12;
      --page-bg-deep: #101722;
      --panel: rgba(13, 18, 25, 0.84);
      --panel-strong: rgba(17, 23, 32, 0.96);
      --ink: #ecf2f8;
      --muted: #93a0af;
      --border: rgba(255, 255, 255, 0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(244, 106, 52, 0.12), transparent 24rem),
        radial-gradient(circle at top right, rgba(141, 198, 255, 0.18), transparent 28rem),
        linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-deep) 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(16, 19, 23, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 19, 23, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 90%);
    }

    :root[data-theme="dark"] body::before {
      opacity: 0.14;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.03em;
    }

    .site-shell {
      position: relative;
      z-index: 1;
    }

    .glass-panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
    }

    :root[data-theme="dark"] .glass-panel {
      background: rgba(13, 18, 25, 0.82);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    .editorial-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(16, 19, 23, 0.06);
      color: rgba(16, 19, 23, 0.75);
    }

    :root[data-theme="dark"] .editorial-kicker {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(236, 242, 248, 0.76);
    }

    .editorial-kicker::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: var(--accent-orange);
      box-shadow: 0 0 0 6px rgba(244, 106, 52, 0.12);
    }

    .headline-balance {
      text-wrap: balance;
    }

    .lift-on-hover {
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .lift-on-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 70px rgba(15, 23, 42, 0.14);
      border-color: rgba(16, 19, 23, 0.14);
    }

    .filter-disclosure summary {
      list-style: none;
    }

    .filter-disclosure summary::-webkit-details-marker {
      display: none;
    }

    .glow-ring {
      position: relative;
      isolation: isolate;
    }

    .glow-ring::after {
      display: none;
    }

    .text-shadow-soft {
      text-shadow: 0 10px 32px rgba(15, 23, 42, 0.22);
    }

    :root[data-theme="dark"] .text-shadow-soft {
      text-shadow: 0 12px 36px rgba(0, 0, 0, 0.34);
    }

    :root[data-theme="dark"] .bg-white,
    :root[data-theme="dark"] .bg-white\/70,
    :root[data-theme="dark"] .bg-white\/80,
    :root[data-theme="dark"] .bg-white\/90,
    :root[data-theme="dark"] .bg-white\/95,
    :root[data-theme="dark"] .bg-white\/\[0\.82\],
    :root[data-theme="dark"] .bg-white\/\[0\.85\],
    :root[data-theme="dark"] .bg-white\/\[0\.88\],
    :root[data-theme="dark"] .bg-white\/\[0\.9\] {
      background-color: rgba(18, 25, 34, 0.92) !important;
    }

    :root[data-theme="dark"] .bg-slate-50,
    :root[data-theme="dark"] .hover\:bg-slate-50:hover {
      background-color: rgba(20, 28, 38, 0.92) !important;
    }

    :root[data-theme="dark"] .bg-slate-100,
    :root[data-theme="dark"] .hover\:bg-slate-100:hover {
      background-color: rgba(27, 36, 48, 0.95) !important;
    }

    :root[data-theme="dark"] .bg-slate-950,
    :root[data-theme="dark"] .hover\:bg-slate-800:hover,
    :root[data-theme="dark"] .hover\:bg-slate-950:hover {
      background-color: #05080d !important;
    }

    :root[data-theme="dark"] .border-slate-200,
    :root[data-theme="dark"] .border-slate-300,
    :root[data-theme="dark"] .border-slate-400,
    :root[data-theme="dark"] .border-white\/40 {
      border-color: rgba(255, 255, 255, 0.1) !important;
    }

    :root[data-theme="dark"] .text-slate-950,
    :root[data-theme="dark"] .text-slate-900,
    :root[data-theme="dark"] .text-slate-800 {
      color: #edf3f9 !important;
    }

    :root[data-theme="dark"] .text-slate-700,
    :root[data-theme="dark"] .text-slate-600,
    :root[data-theme="dark"] .text-slate-500,
    :root[data-theme="dark"] .text-slate-400 {
      color: #95a2b1 !important;
    }

    :root[data-theme="dark"] input,
    :root[data-theme="dark"] select,
    :root[data-theme="dark"] textarea {
      color: #edf3f9 !important;
      background-color: rgba(14, 20, 29, 0.95) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
    }

    :root[data-theme="dark"] input::placeholder,
    :root[data-theme="dark"] textarea::placeholder {
      color: #748191 !important;
    }

    :root[data-theme="dark"] summary,
    :root[data-theme="dark"] label,
    :root[data-theme="dark"] option {
      color: #d8e0e8;
    }

    :root[data-theme="dark"] [data-theme-toggle] {
      background: rgba(18, 25, 34, 0.92) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #edf3f9 !important;
    }

    :root[data-theme="dark"] [data-theme-toggle]:hover {
      background: rgba(24, 32, 43, 0.96) !important;
    }
  </style>
</head>

<body>
  <div class="site-shell">
    {% include "partials/navbar.html" %}

    <main class="mx-auto max-w-[1440px] px-3 py-4 sm:px-5 sm:py-6 lg:px-8">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div class="glass-panel rounded-2xl px-4 py-3 text-sm text-slate-700">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
  </div>

  <script>
    (function () {
      var key = 'autosite-theme';
      var root = document.documentElement;

      function applyTheme(theme) {
        root.dataset.theme = theme;
        root.style.colorScheme = theme;

        document.querySelectorAll('[data-theme-icon]').forEach(function (node) {
          node.textContent = theme === 'dark' ? '☀' : '☾';
        });

        document.querySelectorAll('[data-theme-action-label]').forEach(function (node) {
          node.textContent = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
        });

        document.querySelectorAll('[data-theme-toggle]').forEach(function (button) {
          button.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
          button.setAttribute(
            'aria-label',
            theme === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'
          );
        });
      }

      document.querySelectorAll('[data-theme-toggle]').forEach(function (button) {
        button.addEventListener('click', function () {
          var nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          try {
            localStorage.setItem(key, nextTheme);
          } catch (error) {}
          applyTheme(nextTheme);
        });
      });

      applyTheme(root.dataset.theme || 'light');
    })();
  </script>
</body>
</html>
